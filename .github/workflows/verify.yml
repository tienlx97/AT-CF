name: CI
on:
  # Runs on pull requests (the merge gate for agent work, ADR-0004) and on demand.
  # Not on every push: local ./harness/verify.sh stays the per-task gate.
  pull_request:
  workflow_dispatch:
concurrency:
  group: verify-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: ./harness/audit-harness.sh
      - run: ./harness/verify.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: frontend-verification
          path: harness/runs/
          retention-days: 14
